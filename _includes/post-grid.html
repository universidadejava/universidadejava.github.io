<article class="tile" itemscope itemtype="https://schema.org/Article">
  <a href="{{ site.url }}{{ post.url }}" title="{{ post.title }}" class="post-teaser">
    {% if post.image.teaser %}
      <img src="{{ site.url }}/images/{{ post.image.teaser }}" 
           alt="" 
           loading="lazy" 
           decoding="async" 
           width="400" 
           height="250" 
           itemprop="image">
    {% else %}
      <img src="{{ site.url }}/images/{{ site.teaser }}" 
           alt="" 
           loading="lazy" 
           decoding="async" 
           width="400" 
           height="250" 
           itemprop="image">
    {% endif %}
  </a>
  {% if post.date %}
    <p class="entry-date date published">
      <time datetime="{{ post.date | date: '%Y-%m-%d' }}" itemprop="datePublished">
        {{ post.date | date: "%d/%m/%Y" }}
      </time>
    </p>
  {% endif %}
  <h2 class="post-title" itemprop="name">
    <a href="{{ site.url }}{{ post.url }}">{{ post.title }}</a>
  </h2>
  <p class="post-excerpt" itemprop="description">{{ post.excerpt | strip_html | truncate: 160 }}</p>
</article>
